<!DOCTYPE html>

<link rel="stylesheet" href="_ds/lcs-design-system-bd327249-21f0-4be1-9d16-17b906d09fd9/fonts/fonts.css">
<style>
:root{--y:#FCD727;--k:#000;--g:#505252;--c:#FFF8DA;--gl:#CDCCCC;--bg:#F4F2EA;--r:20px;--red:#C0392B;--green:#2E8B5B;--blue:#2C6E9B;
--font:'MuseoSans',system-ui,-apple-system,Segoe UI,sans-serif;--disp:'MuseoSans',system-ui,sans-serif}

main{max-width:1200px;margin:0 auto;padding:16px 14px 60px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{background:var(--y);color:#000;border:none;border-radius:999px;padding:12px 24px;font-weight:800;font-size:15px;min-height:44px}

.nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}

.tag.abs{background:#F8D9D5;color:var(--red)}.tag.rep{background:#DCEBF7;color:#134B72}.tag.close{background:#E6E6E4;color:var(--g)}
.row.gone .h,.row.gone .s b{text-decoration:line-through;color:var(--g)}

.cell .d i{font-style:normal;font-size:11px;font-weight:700;color:var(--g)}
.pill{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;background:#ECECEA;border-radius:8px;padding:4px 6px;margin-top:3px;min-width:0;font-variant-numeric:tabular-nums}.pill .t{display:flex;flex-direction:column;line-height:1.15;flex:none;font-size:11px}.pill .t{flex-direction:row;align-items:stretch;gap:5px}.pill .tt{display:flex;flex-direction:column;justify-content:space-between;gap:6px}.pill .ar{position:relative;width:8px;align-self:stretch;min-height:22px}.pill .ar:before{content:'';position:absolute;top:1px;left:50%;width:6px;height:6px;border:1.5px solid #000;border-radius:50%;box-sizing:border-box;transform:translateX(-50%)}.pill .ar:after{content:'';position:absolute;left:50%;top:8px;bottom:2px;width:1.5px;background:#000;transform:translateX(-50%)}.pill .ar i{position:absolute;left:50%;bottom:2px;width:5px;height:5px;border:solid #000;border-width:0 1.5px 1.5px 0;transform:translateX(-50%) rotate(45deg)}.pill .sn{flex:1;min-width:0;text-align:left;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;hyphens:auto;font-size:10.5px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.mc{width:100%;max-width:420px}.mc .card{box-shadow:0 20px 50px rgba(0,0,0,.3)}
.pill.on{outline:2px solid #000}.pill{cursor:pointer}.pill.gone{text-decoration:line-through;color:var(--g);background:#F8D9D5}
.pill.rep{background:#DCEBF7}.pill.cl{background:#E6E6E4;color:var(--g)}
.pill{width:100%}@container (max-width:135px){.pill{flex-direction:column;align-items:flex-start;gap:2px}.pill .sn{text-align:left;width:100%}}

.dots{display:none;gap:3px;margin-top:6px;flex-wrap:wrap}.dots u{width:7px;height:7px;border-radius:50%;background:#000;display:block}.dots u.g{background:var(--red)}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--g);margin:12px 2px 14px}
.leg span{display:flex;align-items:center;gap:6px}.leg s{width:14px;height:14px;border-radius:5px;display:block;text-decoration:none}
@media(max-width:700px){#days{grid-template-columns:1fr;overflow:visible}.day .row{flex-direction:row;gap:14px;align-items:flex-start}.day .row .h{min-width:96px}.mg{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.wn{display:none}.mg .mw{display:none}.cell{min-height:52px;padding:5px 3px}.cell .d i,.pill .sn{display:none}.pill{padding:3px 4px;justify-content:center}.pill .t{font-size:10px}.more{font-size:10px;text-align:center}.cell .d{font-size:12px}}
</style></head>
<body>
<div id="demo" class="demo" style="display:none">Données de démonstration</div>
<header><h1>Mon planning</h1><div class="who" id="who"></div></header>
<main>
  <div id="login" class="msg card"><h2>Mon planning</h2><p style="color:var(--g)">Connectez-vous avec l'adresse e-mail professionnelle renseignée sur votre fiche agent.</p><button class="btn" onclick="login()">Se connecter avec Microsoft</button><p id="lerr" style="color:var(--red);font-size:13px"></p></div>
  <div id="load" class="msg" style="display:none;color:var(--g)">Chargement du planning…</div>
  <div id="app" style="display:none">
    <div class="card" id="filt"></div>
    <div class="seg" id="vw"><button data-v="week" onclick="setView('week')">Semaine</button><button data-v="month" class="on" onclick="setView('month')">Mois</button></div>
    <div class="nav"><button onclick="go(-1)" aria-label="Précédent">‹</button><div class="t" id="wk"></div><button onclick="go(1)" aria-label="Suivant">›</button><button class="today" onclick="go(0)">Aujourd'hui</button></div>
    <div id="days"></div>
    <div id="month"></div>
    <div id="detail"></div>
    <div id="modal"></div>
  </div>
<div style="text-align:center;font-size:11.5px;color:var(--g);margin-top:24px">Version du 21/10 09:36</div>
</main>
<script>
const CFG={clientId:'99c4bf43-6e9f-4b9d-839c-eab0e1716357',authority:'https://login.microsoftonline.com/4dffba4f-a634-4907-bf2a-a4e013bbf6d3',dv:'https://orgfad8e0a9.crm12.dynamics.com'};
const API=CFG.dv+'/api/data/v9.2/',SCOPES=[CFG.dv+'/user_impersonation'];
const JOURS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'],JF=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOTIFS={'Congés payés':'Congés','Maladie':'Maladie','Formation':'Formation','Autre':'Absence'};
let filtOpen=(()=>{try{const v=localStorage.getItem('lcs-planning-filt-open');if(v!==null)return v==='1'}catch(e){}return window.innerWidth>700})(),selShift=null,view='month',monthStart=new Date(new Date().getFullYear(),new Date().getMonth(),1),selDay=null,msalApp,email='',D=null,mine=[],sel=new Set(),weekStart=monday(new Date()),q='';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
function monday(d){const x=new Date(d);const k=x.getDay();x.setDate(x.getDate()-k+(k===0?-6:1));x.setHours(0,0,0,0);return x}
function weekNum(d){const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=u.getUTCDay()||7;u.setUTCDate(u.getUTCDate()+4-n);return Math.ceil(((u-new Date(Date.UTC(u.getUTCFullYear(),0,1)))/864e5+1)/7)}
const isA=d=>weekNum(d)%2===1;
const mins=t=>{const m=/(\d+):(\d+)/.exec(t||'');return m?(+m[1])*60+(+m[2]):0};

/* ── Auth ── */
(function(){
  let iframed=false;try{iframed=window.parent!==window}catch(e){iframed=true}
  if(location.hash==='#demo'||iframed){startDemo();return}
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js';
  s.onload=boot;s.onerror=()=>showLogin('Impossible de charger MSAL. Vérifiez votre connexion.');document.head.appendChild(s);
})();
function showLogin(e){$('load').style.display='none';$('app').style.display='none';$('login').style.display='block';$('lerr').textContent=e||''}
async function boot(){
  try{
    msalApp=new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:CFG.authority,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'localStorage'}});
    await msalApp.initialize();await msalApp.handleRedirectPromise();
    const a=msalApp.getAllAccounts();if(!a.length){showLogin();return}
    start(a[0]);
  }catch(e){showLogin('Erreur : '+e.message)}
}
function login(){msalApp.loginRedirect({scopes:SCOPES}).catch(e=>showLogin('Erreur : '+e.message))}
function logout(){if(msalApp)msalApp.logoutRedirect();else location.reload()}
async function token(acc){
  try{return (await msalApp.acquireTokenSilent({scopes:SCOPES,account:acc})).accessToken}
  catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES,account:acc});await new Promise(()=>{})}
}

/* ── Données Dataverse ── */
async function getAll(tok,set){
  const H={Authorization:'Bearer '+tok,Accept:'application/json','OData-MaxVersion':'4.0','OData-Version':'4.0',Prefer:'odata.include-annotations="OData.Community.Display.V1.FormattedValue",odata.maxpagesize=5000'};
  let out=[],next=API+set;
  while(next){const r=await fetch(next,{headers:H});if(!r.ok)throw new Error(set.split('?')[0]+' → '+r.status);const j=await r.json();out=out.concat(j.value);next=j['@odata.nextLink']}
  return out;
}
async function start(acc){
  email=(acc.username||'').trim().toLowerCase();
  $('login').style.display='none';$('load').style.display='block';
  $('who').innerHTML=esc(email)+' <button onclick="logout()">Déconnexion</button>';
  try{
    const tok=await token(acc);
    const T=['agent','affectation','site','absence','remplacement','exception','fermeture'];
    const res=await Promise.all(T.map(t=>getAll(tok,'lcs_'+t+'s'+(t==='agent'?'?$select=lcs_agentid,lcs_nom,lcs_prenom,lcs_mailpro,lcs_mailperso,lcs_type,statecode':''))));
    const R={};T.forEach((t,i)=>R[t]=res[i]);
    D=convert(R);init();
  }catch(e){showLogin('Chargement impossible : '+e.message)}
}
function convert(R){
  const F=(r,c)=>r[c+'@OData.Community.Display.V1.FormattedValue']||'',V=(r,c)=>r[c]==null?'':r[c],L=(r,c)=>r['_'+c+'_value']||'';
  const jours=s=>(s||'').split(/;\s*/).map(x=>x.trim()).filter(Boolean),dt=(r,c)=>(V(r,c)+'').slice(0,10);
  const NAT={'Poste fixe':'','Passage':'Passage','Permanence volante':'Permanence'};
  const EXT={'Ajout':'add','Modification':'mod','Libération':'del'};
  return{
    agents:R.agent.filter(a=>a.statecode!==1&&(F(a,'lcs_type')!=='Siège'||/^(AUGRAUD|BULTEZ|PERRAUDIN|DELINEAU|GARCIA|BIWOLÉ BIWOLÉ|DUVERGER)$/i.test(V(a,'lcs_nom')))).map(a=>({id:a.lcs_agentid,nom:[V(a,'lcs_prenom'),V(a,'lcs_nom')].filter(Boolean).join(' '),mails:[V(a,'lcs_mailpro'),V(a,'lcs_mailperso')].map(m=>m.trim().toLowerCase()).filter(Boolean)})),
    sites:Object.fromEntries(R.site.map(s=>[s.lcs_siteid,V(s,'lcs_nom')])),
    affec:R.affectation.filter(f=>f.statecode!==1).map(f=>({id:f.lcs_affectationid,agentId:L(f,'lcs_agent'),siteId:L(f,'lcs_site'),jours:jours(F(f,'lcs_jours')),debut:V(f,'lcs_debut'),fin:V(f,'lcs_fin'),semaine:F(f,'lcs_semaine')||'Toutes',dd:dt(f,'lcs_datedebut'),df:dt(f,'lcs_datefin'),nature:NAT[F(f,'lcs_nature')]||''})),
    absences:R.absence.filter(a=>a.statecode!==1).map(a=>({id:a.lcs_absenceid,agentId:L(a,'lcs_agent'),dd:dt(a,'lcs_datedebut'),df:dt(a,'lcs_datefin'),motif:MOTIFS[F(a,'lcs_motif')]||'Absence',remplId:L(a,'lcs_remplacant')})),
    rempl:R.remplacement.filter(r=>r.statecode!==1).map(r=>({absId:L(r,'lcs_absence'),remplId:L(r,'lcs_remplacant'),siteId:L(r,'lcs_site'),afId:L(r,'lcs_affectation'),date:dt(r,'lcs_date')})),
    except:R.exception.filter(e=>e.statecode!==1).map(e=>({agentId:L(e,'lcs_agent'),date:dt(e,'lcs_date'),type:EXT[F(e,'lcs_type')]||'mod',afId:L(e,'lcs_affectation'),siteId:L(e,'lcs_site'),debut:V(e,'lcs_debut'),fin:V(e,'lcs_fin'),nature:NAT[F(e,'lcs_nature')]||''})),
    ferm:R.fermeture.filter(f=>f.statecode!==1).map(f=>({siteId:L(f,'lcs_site'),dd:dt(f,'lcs_datedebut'),df:dt(f,'lcs_datefin')}))
  };
}

/* ── Calcul du planning d'un agent pour un jour ── */
function dayItems(agent,d){
  const ds=ymd(d),lab=JOURS[(d.getDay()+6)%7],a=isA(d),out=[];
  const ab=D.absences.find(x=>x.agentId===agent.id&&ds>=x.dd&&ds<=(x.df||x.dd));
  const closed=sid=>D.ferm.some(f=>f.siteId===sid&&ds>=f.dd&&ds<=(f.df||f.dd));
  const ex=D.except.filter(e=>e.agentId===agent.id&&e.date===ds);
  D.affec.filter(f=>f.agentId===agent.id&&f.jours.includes(lab)&&!(f.dd&&ds<f.dd)&&!(f.df&&ds>f.df)&&!(f.semaine==='A'&&!a)&&!(f.semaine==='B'&&a)).forEach(f=>{
    const e=ex.find(x=>x.afId===f.id&&(x.type==='mod'||x.type==='del'));
    if(e&&e.type==='del')return;
    const it={debut:f.debut,fin:f.fin,siteId:f.siteId,nature:f.nature};
    if(e){it.debut=e.debut||f.debut;it.fin=e.fin||f.fin;it.siteId=e.siteId||f.siteId;it.nature=e.nature||f.nature}
    if(ab){it.abs=ab.motif;const r=D.rempl.find(r=>r.absId===ab.id&&r.date===ds&&(!r.afId||r.afId===f.id));const rid=(r&&r.remplId)||ab.remplId;const ra=rid&&D.agents.find(x=>x.id===rid);if(ra)it.by=ra.nom}
    out.push(it);
  });
  ex.filter(e=>e.type==='add').forEach(e=>out.push({debut:e.debut,fin:e.fin,siteId:e.siteId,nature:e.nature}));
  D.rempl.filter(r=>r.remplId===agent.id&&r.date===ds).forEach(r=>{
    const f=D.affec.find(x=>x.id===r.afId),abs=D.absences.find(x=>x.id===r.absId),who=abs&&D.agents.find(x=>x.id===abs.agentId);
    out.push({debut:f?f.debut:'',fin:f?f.fin:'',siteId:r.siteId||(f&&f.siteId),rep:who?who.nom:'un collègue'});
  });
  out.forEach(it=>{if(closed(it.siteId))it.closed=true});
  return out.sort((x,y)=>mins(x.debut)-mins(y.debut));
}

/* ── Interface ── */
const KEY=()=>'lcs-planning-agents:'+email;
function init(){
  mine=D.agents.filter(a=>a.mails.includes(email)).sort((x,y)=>x.nom.localeCompare(y.nom,'fr'));
  $('load').style.display='none';
  if(!mine.length){$('app').style.display='none';$('login').style.display='block';$('login').innerHTML='<h2>Compte non reconnu</h2><p style="color:var(--g)">'+esc(email)+' n\'est renseignée sur aucune fiche agent. Contactez votre responsable.</p><button class="btn ghost" onclick="logout()">Changer de compte</button>';return}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY()))}catch(e){}
  sel=new Set(saved?mine.filter(a=>saved.includes(a.id)).map(a=>a.id):mine.map(a=>a.id));
  if(!sel.size)sel=new Set(mine.map(a=>a.id));
  selDay=ymd(new Date());$('app').style.display='block';renderFilt();renderDays();
}
function persist(){try{localStorage.setItem(KEY(),JSON.stringify([...sel]))}catch(e){}}
function togFilt(){filtOpen=!filtOpen;try{localStorage.setItem('lcs-planning-filt-open',filtOpen?'1':'0')}catch(e){}renderFilt()}
function renderFilt(){
  if(mine.length<2){$('filt').style.display='none';return}
  const names=mine.filter(a=>sel.has(a.id)).map(a=>a.nom).join(', ')||'Aucun';
  $('filt').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer" onclick="togFilt()" role="button" tabindex="0"><div style="min-width:0"><b>Agents affichés</b>'+(filtOpen?'':'<div style="font-size:12.5px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">'+esc(names)+'</div>')+'</div><span style="font-size:12.5px;color:var(--g);white-space:nowrap;display:flex;align-items:center;gap:8px"><span>'+sel.size+' sur '+mine.length+'</span><span style="display:inline-block;transition:transform .15s;transform:rotate('+(filtOpen?'180':'0')+'deg)">▾</span></span></div>'
   +(filtOpen?'<div style="margin-top:10px;font-size:12.5px;color:var(--g)"><a href="#" onclick="allSel(true);return false">Tous</a> · <a href="#" onclick="allSel(false);return false">Aucun</a></div>'
   +(mine.length>6?'<input class="search" style="margin-top:10px" placeholder="Rechercher un agent…" value="'+esc(q)+'" oninput="q=this.value;renderChips()">':'')+'<div class="chips" id="chips"></div><div style="font-size:12px;color:var(--g);margin-top:10px">Votre sélection est enregistrée sur cet appareil.</div>':'');
  if(filtOpen)renderChips();
}
function renderChips(){
  const list=mine.filter(a=>a.nom.toLowerCase().includes(q.toLowerCase()));
  $('chips').innerHTML=list.map(a=>'<button class="chip'+(sel.has(a.id)?' on':'')+'" onclick="tog(\''+a.id+'\')">'+esc(a.nom)+'</button>').join('')||'<span style="color:var(--g)">Aucun résultat</span>';
}
function tog(id){sel.has(id)?sel.delete(id):sel.add(id);persist();renderChips();const c=$('filt').querySelector('span span');if(c)c.textContent=sel.size+' sur '+mine.length;renderDays()}
function allSel(on){sel=new Set(on?mine.map(a=>a.id):[]);persist();renderFilt();renderDays()}
function go(n){
  if(view==='month'){monthStart=n===0?new Date(new Date().getFullYear(),new Date().getMonth(),1):new Date(monthStart.getFullYear(),monthStart.getMonth()+n,1);selDay=n===0?ymd(new Date()):null}
  else weekStart=n===0?monday(new Date()):new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+7*n);
  renderDays();
}
function setView(v){view=v;if(v==='month'){const t=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+3);monthStart=new Date(t.getFullYear(),t.getMonth(),1)}else if(selDay)weekStart=monday(pd(selDay));renderDays()}
function renderDays(){
  $('days').style.display=view==='week'?'':'none';$('month').style.display=view==='month'?'block':'none';$('detail').style.display=view==='month'?'block':'none';
  document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  view==='week'?renderWeek():renderMonth();
}
function closeShift(){selShift=null;renderMonth()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selShift!=null)closeShift()});
function pickDay(s){selDay=s;selShift=null;renderMonth()}
function pickShift(s,k){selDay=s;selShift=k;renderMonth()}
function dur(a,b){const m=mins(b)-mins(a);return m>0?Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):''):''}
function rowsFor(ags,d){let r=[];ags.forEach(a=>dayItems(a,d).forEach(it=>r.push({a,it})));return r.sort((x,y)=>mins(x.it.debut)-mins(y.it.debut))}
function renderMonth(){
  const y=monthStart.getFullYear(),m=monthStart.getMonth(),ags=mine.filter(a=>sel.has(a.id)),multi=ags.length>1,today=ymd(new Date());
  $('wk').innerHTML=monthStart.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())+'<small>'+ags.length+' agent'+(ags.length>1?'s':'')+' affiché'+(ags.length>1?'s':'')+'</small>';
  if(!ags.length){$('month').innerHTML='<div class="msg card" style="color:var(--g)">Sélectionnez au moins un agent.</div>';$('detail').innerHTML='';return}
  const first=monday(monthStart),last=new Date(y,m+1,0),nb=Math.ceil(((monday(last)-first)/864e5+7)/7);
  let html='<div class="mg"><div class="mh mw"></div>'+JOURS.slice(0,5).map(j=>'<div class="mh">'+j+'</div>').join('');
  for(let w=0;w<nb;w++){
    const ws=new Date(first.getFullYear(),first.getMonth(),first.getDate()+7*w);
    html+='<div class="wn"><span>S'+weekNum(ws)+'</span></div>';
    for(let i=0;i<5;i++){
      const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i),s=ymd(d),rows=rowsFor(ags,d),out=d.getMonth()!==m;
      html+='<div role="button" tabindex="0" class="cell'+(out?' out':'')+(i>4?' we':'')+(s===today?' today':'')+(s===selDay?' sel':'')+'" onclick="pickDay(\''+s+'\')"><div class="d"><span>'+d.getDate()+'</span>'+(rows.length?'<i>'+rows.length+'</i>':'')+'</div>'
       +rows.slice(0,3).map(({a,it},k)=>'<span onclick="event.stopPropagation();pickShift(\''+s+'\','+k+')" class="pill'+(s===selDay&&k===selShift?' on':'')+(it.abs?' gone':it.rep?' rep':it.closed?' cl':'')+'">'+'<span class="t"><span class="tt"><b>'+esc(it.debut)+'</b><b>'+esc(it.fin)+'</b></span><span class="ar"><i></i></span></span><span class="sn">'+esc((D.sites[it.siteId]||'Site').replace(/^(Chantier|Accueil)\s+/i,''))+'</span></span>').join('')
       +(rows.length>3?'<span class="more">+'+(rows.length-3)+' autres</span>':'')
       +(rows.length?'<div class="dots">'+rows.slice(0,6).map(r=>'<u'+(r.it.abs?' class="g"':'')+'></u>').join('')+'</div>':'')+'</div>';
    }
  }
  html+='</div><div class="leg"><span><s style="background:#ECECEA"></s>Créneau</span><span><s style="background:#DCEBF7"></s>Remplacement</span><span><s style="background:#F8D9D5"></s>Absence</span><span><s style="background:#E6E6E4"></s>Site fermé</span></div>';
  $('month').innerHTML=html;
  if(!selDay){$('detail').innerHTML='';return}
  const d=pd(selDay),rows=rowsFor(ags,d);
  let md='';if(selShift!=null&&rows[selShift]){const {a,it}=rows[selShift];
    md='<div class="mb" onclick="closeShift()"><div class="mc" onclick="event.stopPropagation()"><div class="card" style="padding:0;overflow:hidden;margin:0"><div class="dh" style="flex-direction:row;justify-content:space-between;align-items:baseline;background:var(--y)">'+JF[(d.getDay()+6)%7]+' <span style="color:#000">'+d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+'</span></div><div style="padding:16px"><div style="font:800 22px var(--disp)">'+esc(D.sites[it.siteId]||'Site')+'</div>'
     +'<div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-top:14px;font-size:14px"><span style="color:var(--g)">Horaires</span><b>'+esc(it.debut)+' → '+esc(it.fin)+(dur(it.debut,it.fin)?' · '+dur(it.debut,it.fin):'')+'</b><span style="color:var(--g)">Agent</span><b>'+esc(a.nom)+'</b><span style="color:var(--g)">Semaine</span><b>S'+weekNum(d)+'</b></div>'
     +'<div style="margin-top:10px">'+(it.abs?'<span class="tag abs">'+esc(it.abs)+'</span>'+(it.by?'<span class="tag rep">Remplacé par '+esc(it.by)+'</span>':''):'')+(it.rep?'<span class="tag rep">Remplacement de '+esc(it.rep)+'</span>':'')+(it.closed?'<span class="tag close">Site fermé</span>':'')+(it.nature?'<span class="tag close">'+esc(it.nature)+'</span>':'')+'</div>'
     +'<button class="btn ghost" style="margin-top:14px;padding:8px 18px;min-height:38px;font-size:13px" onclick="closeShift()">Fermer</button></div></div></div></div>'}
  $('modal').innerHTML=md;
  $('detail').innerHTML='<div class="card" style="padding:0;overflow:hidden"><div class="dh" style="flex-direction:row;justify-content:space-between;align-items:baseline;background:var(--y)">'+JF[(d.getDay()+6)%7]+' <span style="color:#000">'+d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+'</span></div>'
   +(rows.length?rows.map(({a,it})=>'<div class="row'+(it.abs?' gone':'')+'" style="flex-direction:row;gap:14px;align-items:flex-start"><div class="h" style="min-width:96px">'+esc(it.debut)+'–'+esc(it.fin)+'</div><div class="s"><b>'+esc(D.sites[it.siteId]||'Site')+'</b>'+(multi?'<div class="n">'+esc(a.nom)+'</div>':'')
     +(it.abs?'<span class="tag abs">'+esc(it.abs)+'</span>'+(it.by?'<span class="tag rep">Remplacé par '+esc(it.by)+'</span>':''):'')+(it.rep?'<span class="tag rep">Remplacement de '+esc(it.rep)+'</span>':'')+(it.closed?'<span class="tag close">Site fermé</span>':'')+(it.nature?'<span class="tag close">'+esc(it.nature)+'</span>':'')+'</div></div>').join(''):'<div class="empty">Pas de créneau</div>')+'</div>';
}
function renderWeek(){
  const end=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+4),f=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
  $('wk').innerHTML='Semaine '+weekNum(weekStart)+'<small>'+f(weekStart)+' – '+f(end)+'</small>';
  const ags=mine.filter(a=>sel.has(a.id)),multi=ags.length>1,today=ymd(new Date());let html='';
  if(!ags.length){$('days').innerHTML='<div class="msg card" style="color:var(--g)">Sélectionnez au moins un agent.</div>';return}
  for(let i=0;i<5;i++){
    const d=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+i);
    let rows=[];ags.forEach(a=>dayItems(a,d).forEach(it=>rows.push({a,it})));
    rows.sort((x,y)=>mins(x.it.debut)-mins(y.it.debut));
    html+='<div class="day'+(ymd(d)===today?' today':'')+'"><div class="dh">'+JF[i]+'<span>'+d.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})+'</span></div>'
     +(rows.length?rows.map(({a,it})=>'<div class="row'+(it.abs?' gone':'')+'"><div class="h">'+esc(it.debut)+'–'+esc(it.fin)+'</div><div class="s"><b>'+esc(D.sites[it.siteId]||'Site')+'</b>'
       +(multi?'<div class="n">'+esc(a.nom)+'</div>':'')
       +(it.abs?'<span class="tag abs">'+esc(it.abs)+'</span>'+(it.by?'<span class="tag rep">Remplacé par '+esc(it.by)+'</span>':''):'')
       +(it.rep?'<span class="tag rep">Remplacement de '+esc(it.rep)+'</span>':'')
       +(it.closed?'<span class="tag close">Site fermé</span>':'')
       +(it.nature?'<span class="tag close">'+esc(it.nature)+'</span>':'')+'</div></div>').join(''):'<div class="empty">Pas de créneau</div>')+'</div>';
  }
  $('days').innerHTML=html;
}
